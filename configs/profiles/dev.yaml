name: dev
description: Local development without GPU (mock-vllm)

vllm:
  image: dgxsp/mock-vllm:dev
  pull: false
  command_prefix: [python, /app/mock_vllm.py, serve]
  gpu: false
  ipc_host: false
  shm_size: 64m
  nofile: 65536
  port: 8000
  model_mount: /models
  env:
    HF_HUB_OFFLINE: "1"
    MOCK_LOAD_SECONDS: "8"

timeouts:
  health_s: 120
  stop_s: 10
  slow_warning_s: 30

memory:
  low: 0.4
  default: 0.7
  high: 0.85
  min: 0.1
  max: 0.95
  total_warning: 0.9

monitoring:
  memory_source: procfs
  gpu_source: none

# Startup / runtime error classification. First match wins (top to bottom).
# match:
#   oom_killed: true            container State.OOMKilled
#   exit_code: [137]            container exit code
#   log: [regex, ...]           any line in the full container log (case-insensitive)
# Named groups (?P<name>...) in a log regex are copied into the error params.
# Add new patterns here when Spark shows new failure shapes; no code change needed.

# Startup check: other processes already hold the memory (seen on Spark 2026-10-05, vLLM 0.30.1rc1):
#   ValueError: Free memory on device cuda:0 (9.2/121.69 GiB) on startup is less than desired
#   GPU memory utilization (0.1, 12.17 GiB).
- code: GPU_MEMORY_IN_USE
  match:
    log:
      - "Free memory on device \\S+ \\((?P<free_gib>[\\d.]+)/(?P<total_gib>[\\d.]+) GiB\\) on startup is less than desired GPU memory utilization \\((?P<requested_ratio>[\\d.]+), (?P<requested_gib>[\\d.]+) GiB\\)"
      - "Free memory on device .* is less than desired GPU memory utilization"
- code: OOM
  match: { oom_killed: true }
# Budget too small for weights (seen on Spark 2026-10-06: 7B @ 0.10 ->
#   "Available KV cache memory: -6.06 GiB" then "No available memory for the cache blocks").
- code: OOM
  match:
    log:
      - "Available KV cache memory: (?P<kv_gib>-?[\\d.]+) GiB"
      - "Model loading took (?P<weights_gib>[\\d.]+) GiB memory"
      - "Desired GPU memory utilization is \\((?P<requested_ratio>[\\d.]+), (?P<requested_gib>[\\d.]+) GiB\\)"
      - "out of memory"
      - "OutOfMemoryError"
      - "No available memory for the cache blocks"
      - "insufficient memory"
      - "Cannot allocate memory"
    require:
      - "out of memory|OutOfMemoryError|No available memory for the cache blocks|insufficient memory|Cannot allocate memory"
- code: OOM
  match: { exit_code: [137] }
- code: REMOTE_CODE_REQUIRED
  match:
    log:
      - "trust_remote_code"
      - "--trust-remote-code"
- code: MODEL_UNSUPPORTED
  match:
    log:
      - "Model architectures .* are not supported"
      - "is not supported for now"
      - "Unsupported model"
- code: MODEL_NOT_FOUND
  match:
    log:
      - "No config.json found"
      - "does not appear to have a file named config.json"
      - "Repository Not Found"
      - "is not a local folder and is not a valid model identifier"
- code: GPU_UNAVAILABLE
  match:
    log:
      - "No CUDA GPUs are available"
      - "could not select device driver"
      - "CUDA driver initialization failed"
- code: PORT_CONFLICT
  match:
    log:
      - "address already in use"
      - "port is already allocated"
